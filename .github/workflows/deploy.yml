name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ds-3.0/package-lock.json

      - name: Install dependencies (DS 3.0)
        working-directory: ds-3.0
        run: npm install 2>&1

      - name: Build DS 3.0 (Angular + PrimeNG)
        working-directory: ds-3.0
        run: npx ng build --base-href /informatizaDS/3.0/ 2>&1
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Assemble site (3.0 + 3.1)
        run: |
          mkdir -p _site/3.0 _site/3.1
          cp -r ds-3.0/dist/sakai-ng/browser/. _site/3.0/
          cp -r ds-3.1/. _site/3.1/
          cp .github/pages/index.html _site/index.html
          # Arquivos para agentes de IA
          cp .github/pages/llms.txt _site/llms.txt
          cp AGENTS.md _site/AGENTS.md
          cp ds-3.0/AGENTS.md ds-3.0/tokens.json _site/3.0/
          {
            cat AGENTS.md; printf '\n\n---\n\n'
            cat ds-3.0/AGENTS.md; printf '\n\n## Tokens DS 3.0 (tokens.json)\n\n```json\n'; cat ds-3.0/tokens.json; printf '```\n\n---\n\n'
            cat ds-3.1/AGENTS.md; printf '\n\n## Tokens DS 3.1 (tokens.json)\n\n```json\n'; cat ds-3.1/tokens.json; printf '```\n'
          } > _site/llms-full.txt
          # SPA fallback do 3.0: o 404 raiz carrega o app Angular.
          # Links antigos (/informatizaDS/<rota>) sao redirecionados para /informatizaDS/3.0/<rota>.
          sed 's#<head>#<head><script>(function(){var b="/informatizaDS/",p=location.pathname;if(p.indexOf(b)===0\&\&p.indexOf(b+"3.0/")!==0\&\&p.indexOf(b+"3.1/")!==0){location.replace(b+"3.0/"+p.slice(b.length)+location.search+location.hash);}})();</script>#' \
            _site/3.0/index.html > _site/404.html
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
